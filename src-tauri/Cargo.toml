[package]
name = "kpmanager"
version = "0.2.0"
description = "Gestor de múltiples vaults de KeePassXC"
authors = ["fmartineze"]
license = "MIT"
repository = "https://github.com/fmartineze/kpmanager"
edition = "2024"

[lib]
name = "kpmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
thiserror = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Foundation", "Security_Credentials", "Storage_Streams", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
