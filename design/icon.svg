<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8576FF"/>
      <stop offset="0.5" stop-color="#5442E6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD7FF"/>
    </linearGradient>
    <linearGradient id="hole" gradientUnits="userSpaceOnUse" x1="0" y1="458" x2="0" y2="700">
      <stop offset="0" stop-color="#6B5CF6"/>
      <stop offset="1" stop-color="#4331C9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#1B0F6B" flood-opacity="0.45"/>
    </filter>
    <clipPath id="clip"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- Capas detrás: varios vaults -->
    <path d="M512 118 L254 226 V430 C254 592 366 708 512 758 C658 708 770 592 770 430 V226 Z"
          fill="#FFFFFF" fill-opacity="0.16" transform="translate(0 -4)"/>
    <path d="M512 150 L238 266 V486 C238 660 358 786 512 840 C666 786 786 660 786 486 V266 Z"
          fill="#FFFFFF" fill-opacity="0.26"/>

    <!-- Escudo principal -->
    <g filter="url(#shadow)">
      <path d="M512 196 L224 316 V540 C224 722 352 856 512 912 C672 856 800 722 800 540 V316 Z"
            fill="url(#shield)"/>
      <path d="M512 196 L224 316 V540 C224 722 352 856 512 912 C672 856 800 722 800 540 V316 Z"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="6"/>
    </g>

    <!-- Cerradura -->
    <circle cx="512" cy="528" r="70" fill="url(#hole)"/>
    <path d="M482 568 H542 L562 700 H462 Z" fill="url(#hole)"/>
  </g>
</svg>
